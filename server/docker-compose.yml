version: '3.8'
services:
  server:
    build: .
    image: myutil-server:dev
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/data
      - ./updates:/app/updates
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/agents"]
      interval: 30s
      timeout: 5s
      retries: 3

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Manager</title>
    <link rel="stylesheet" href="/api/web/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Agent Management System</h1>
            <nav>
                <button onclick="showTab('agents')" class="nav-btn active" id="btn-agents">Агенты</button>
                <button onclick="showTab('tasks')" class="nav-btn" id="btn-tasks">Задачи</button>
                <button onclick="showTab('audit')" class="nav-btn" id="btn-audit">Журнал</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <!-- Agents Tab -->
        <div id="tab-agents" class="tab-content active">
            <div class="toolbar">
                <button onclick="loadAgents()" class="btn-primary">Обновить</button>
            </div>
            <div class="card">
                <table>
                    <thead>
                        <tr>
                            <th>Хост</th>
                            <th>ОС/Арх</th>
                            <th>Версия</th>
                            <th>Статус</th>
                            <th>Последний раз</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="agents-list"></tbody>
                </table>
            </div>
        </div>

        <!-- Tasks Tab -->
        <div id="tab-tasks" class="tab-content">
            <div class="card form-card">
                <h3>Создать задачу</h3>
                <div class="form-grid">
                    <input type="text" id="task-agent-id" placeholder="Agent ID">
                    <select id="task-type">
                        <option value="search">Search (Поиск ИОР)</option>
                        <option value="wipe_file">Wipe File (Затирка файла)</option>
                        <option value="wipe_disk">Wipe Disk (Затирка диска)</option>
                    </select>
                    <input type="text" id="task-params" placeholder='Params (JSON, e.g. {"path":"/etc/passwd"})'>
                    <input type="text" id="task-actor" placeholder="Оператор (Actor)">
                    <button onclick="createTask()" class="btn-primary">Создать задачу</button>
                </div>
            </div>
            <div class="toolbar">
                <button onclick="loadTasks()" class="btn-primary">Обновить</button>
            </div>
            <div class="card">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Agent ID</th>
                            <th>Тип</th>
                            <th>Статус</th>
                            <th>Создана</th>
                            <th>Результат</th>
                        </tr>
                    </thead>
                    <tbody id="tasks-list"></tbody>
                </table>
            </div>
        </div>

        <!-- Audit Tab -->
        <div id="tab-audit" class="tab-content">
            <div class="toolbar">
                <button onclick="loadAudit()" class="btn-primary">Обновить</button>
            </div>
            <div class="card">
                <table>
                    <thead>
                        <tr>
                            <th>Время</th>
                            <th>Кто</th>
                            <th>Действие</th>
                            <th>Цель</th>
                            <th>Детали</th>
                        </tr>
                    </thead>
                    <tbody id="audit-list"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="/api/web/app.js"></script>
</body>
</html>
